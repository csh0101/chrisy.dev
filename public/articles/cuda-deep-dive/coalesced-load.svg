<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Coalesced versus strided global load</title>
  <desc id="desc">A warp accessing adjacent addresses can be served by fewer memory transactions than strided scattered addresses.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}.title{font:700 34px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.sub{font:500 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#73798a}.label{font:700 21px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.small{font:600 14px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#687084}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3f4658}.panel{fill:#fff;stroke:#dce3f2;stroke-width:2}.good{fill:#eaf8f0;stroke:#7ec79a}.bad{fill:#fff0f5;stroke:#dd8bad}.mem{fill:#f4f7fb;stroke:#cfd8ea}.thread{fill:#edf2ff;stroke:#86aef2}.arrow{fill:none;stroke:#7d879c;stroke-width:2;marker-end:url(#arrow)}.ok{stroke:#57b985}.warn{stroke:#d97878}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7d879c"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="72">Coalesced Load：warp 的地址要排成一段</text>
  <text class="sub" x="64" y="105">读了同样多的元素，地址形状不同，global memory transaction 数量可能差很多。</text>

  <rect class="panel good" x="70" y="155" width="540" height="465" rx="22"/>
  <text class="label" x="105" y="200">连续访问：相邻 lane 读相邻地址</text>
  <text class="small" x="105" y="228">thread 0..31 -> x[0..31]</text>
  <g transform="translate(105 265)">
    <text class="small" x="0" y="-18">Warp lanes</text>
    <g>
      <rect class="thread" x="0" y="0" width="44" height="34" rx="8"/><text class="mono" x="14" y="23">0</text>
      <rect class="thread" x="54" y="0" width="44" height="34" rx="8"/><text class="mono" x="68" y="23">1</text>
      <rect class="thread" x="108" y="0" width="44" height="34" rx="8"/><text class="mono" x="122" y="23">2</text>
      <rect class="thread" x="162" y="0" width="44" height="34" rx="8"/><text class="mono" x="176" y="23">3</text>
      <rect class="thread" x="216" y="0" width="44" height="34" rx="8"/><text class="mono" x="226" y="23">...</text>
      <rect class="thread" x="270" y="0" width="44" height="34" rx="8"/><text class="mono" x="280" y="23">31</text>
    </g>
    <g transform="translate(0 135)">
      <text class="small" x="0" y="-18">Global memory segment</text>
      <rect class="mem" x="0" y="0" width="432" height="64" rx="12"/>
      <g>
        <rect x="16" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="52" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="88" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="124" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="160" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="196" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="232" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="268" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="304" y="16" width="32" height="32" fill="#b8ecc9"/><rect x="340" y="16" width="32" height="32" fill="#b8ecc9"/></g>
    </g>
    <line class="arrow ok" x1="22" y1="42" x2="32" y2="128"/>
    <line class="arrow ok" x1="76" y1="42" x2="68" y2="128"/>
    <line class="arrow ok" x1="130" y1="42" x2="104" y2="128"/>
    <line class="arrow ok" x1="184" y1="42" x2="140" y2="128"/>
    <text class="mono" x="0" y="260">少量 transaction，带宽利用率高</text>
  </g>

  <rect class="panel bad" x="670" y="155" width="540" height="465" rx="22"/>
  <text class="label" x="705" y="200">跨步访问：相邻 lane 读很远的地址</text>
  <text class="small" x="705" y="228">thread i -> x[i * stride]</text>
  <g transform="translate(705 265)">
    <text class="small" x="0" y="-18">Warp lanes</text>
    <rect class="thread" x="0" y="0" width="44" height="34" rx="8"/><text class="mono" x="14" y="23">0</text>
    <rect class="thread" x="54" y="0" width="44" height="34" rx="8"/><text class="mono" x="68" y="23">1</text>
    <rect class="thread" x="108" y="0" width="44" height="34" rx="8"/><text class="mono" x="122" y="23">2</text>
    <rect class="thread" x="162" y="0" width="44" height="34" rx="8"/><text class="mono" x="176" y="23">3</text>
    <rect class="thread" x="216" y="0" width="44" height="34" rx="8"/><text class="mono" x="226" y="23">...</text>
    <rect class="thread" x="270" y="0" width="44" height="34" rx="8"/><text class="mono" x="280" y="23">31</text>
    <g transform="translate(0 135)">
      <text class="small" x="0" y="-18">Global memory segments</text>
      <rect class="mem" x="0" y="0" width="84" height="64" rx="12"/><rect class="mem" x="108" y="0" width="84" height="64" rx="12"/><rect class="mem" x="216" y="0" width="84" height="64" rx="12"/><rect class="mem" x="324" y="0" width="84" height="64" rx="12"/>
      <rect x="26" y="16" width="32" height="32" fill="#ffc9d9"/><rect x="134" y="16" width="32" height="32" fill="#ffc9d9"/><rect x="242" y="16" width="32" height="32" fill="#ffc9d9"/><rect x="350" y="16" width="32" height="32" fill="#ffc9d9"/>
    </g>
    <line class="arrow warn" x1="22" y1="42" x2="42" y2="128"/>
    <line class="arrow warn" x1="76" y1="42" x2="150" y2="128"/>
    <line class="arrow warn" x1="130" y1="42" x2="258" y2="128"/>
    <line class="arrow warn" x1="184" y1="42" x2="366" y2="128"/>
    <text class="mono" x="0" y="260">更多 transaction，有效带宽下降</text>
  </g>
</svg>
