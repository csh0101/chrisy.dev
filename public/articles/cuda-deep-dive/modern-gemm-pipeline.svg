<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Modern GEMM pipeline</title>
  <desc id="desc">Modern GEMM overlaps global-to-shared transfer, shared-to-register load, MMA computation, and store with software pipelining.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}.title{font:700 34px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.sub{font:500 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#73798a}.label{font:700 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.small{font:600 14px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#687084}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3f4658}.stage{fill:#fff;stroke:#dce3f2;stroke-width:2}.s1{fill:#edf2ff;stroke:#86aef2}.s2{fill:#eaf8f0;stroke:#7ec79a}.s3{fill:#fff6df;stroke:#ddb85d}.s4{fill:#fff0f5;stroke:#dd8bad}.arrow{fill:none;stroke:#7d879c;stroke-width:2.4;marker-end:url(#arrow)}.bar{fill:#f4f7fb;stroke:#cfd8ea}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7d879c"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="72">现代 GEMM Pipeline：把搬运、等待、计算叠起来</text>
  <text class="sub" x="64" y="105">warp-level tiling、MMA、TMA、WGMMA、persistent kernel 都在服务同一条流水线。</text>

  <g transform="translate(80 170)">
    <rect class="stage s1" width="230" height="120" rx="18"/>
    <text class="label" x="34" y="45">Global -> Shared</text>
    <text class="small" x="34" y="75">vectorized load / TMA</text>
    <text class="small" x="34" y="98">异步预取下一块 tile</text>
  </g>
  <g transform="translate(365 170)">
    <rect class="stage s2" width="230" height="120" rx="18"/>
    <text class="label" x="34" y="45">Shared Layout</text>
    <text class="small" x="34" y="75">transpose / swizzle</text>
    <text class="small" x="34" y="98">为 warp 读取准备形状</text>
  </g>
  <g transform="translate(650 170)">
    <rect class="stage s3" width="230" height="120" rx="18"/>
    <text class="label" x="34" y="45">Warp / Register</text>
    <text class="small" x="34" y="75">warp-level tiling</text>
    <text class="small" x="34" y="98">fragment 进入 register</text>
  </g>
  <g transform="translate(935 170)">
    <rect class="stage s4" width="230" height="120" rx="18"/>
    <text class="label" x="34" y="45">MMA / WGMMA</text>
    <text class="small" x="34" y="75">Tensor Core 计算</text>
    <text class="small" x="34" y="98">累加到 accumulator</text>
  </g>
  <line class="arrow" x1="310" y1="230" x2="357" y2="230"/>
  <line class="arrow" x1="595" y1="230" x2="642" y2="230"/>
  <line class="arrow" x1="880" y1="230" x2="927" y2="230"/>

  <text class="label" x="95" y="380">Software Pipelining：不同 K tile 错开执行</text>
  <g transform="translate(95 415)">
    <rect class="bar" x="0" y="0" width="1040" height="180" rx="18"/>
    <text class="mono" x="25" y="42">time -></text>
    <rect class="s1" x="140" y="25" width="190" height="34" rx="9"/><text class="mono" x="180" y="48">load tile k+1</text>
    <rect class="s2" x="360" y="25" width="190" height="34" rx="9"/><text class="mono" x="397" y="48">layout k+1</text>
    <rect class="s3" x="280" y="78" width="190" height="34" rx="9"/><text class="mono" x="318" y="101">read tile k</text>
    <rect class="s4" x="500" y="78" width="190" height="34" rx="9"/><text class="mono" x="555" y="101">MMA k</text>
    <rect class="s1" x="600" y="131" width="190" height="34" rx="9"/><text class="mono" x="640" y="154">load tile k+2</text>
    <rect class="s4" x="800" y="131" width="190" height="34" rx="9"/><text class="mono" x="848" y="154">MMA k+1</text>
  </g>
  <text class="small" x="95" y="642">目标不是多一个术语，而是让 global load、shared read、Tensor Core 计算尽量同时发生。</text>
</svg>
