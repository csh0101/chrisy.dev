<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Tiling data reuse in matrix multiplication</title>
  <desc id="desc">A tile from A and a tile from B are loaded once and reused to produce a C tile.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}.title{font:700 34px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.sub{font:500 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#73798a}.label{font:700 21px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.small{font:600 14px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#687084}.mono{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3f4658}.cell{fill:#fff;stroke:#dce3f2}.a{fill:#eaf2ff;stroke:#86aef2}.b{fill:#eaf8f0;stroke:#7ec79a}.c{fill:#fff0f5;stroke:#dd8bad}.arrow{fill:none;stroke:#7d879c;stroke-width:2.4;marker-end:url(#arrow)}.reuse{fill:none;stroke:#e4844f;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#orange)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7d879c"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e4844f"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="72">Tiling 的本质：一次搬进来，反复用 T 次</text>
  <text class="sub" x="64" y="105">A_tile 和 B_tile 从 global memory 只搬一次，重复使用发生在 shared memory 里。</text>

  <text class="label" x="130" y="170">A_tile</text>
  <g transform="translate(120 195)">
    <rect class="a" x="0" y="0" width="240" height="240" rx="10"/>
    <g>
      <line x1="60" y1="0" x2="60" y2="240" class="cell"/><line x1="120" y1="0" x2="120" y2="240" class="cell"/><line x1="180" y1="0" x2="180" y2="240" class="cell"/>
      <line x1="0" y1="60" x2="240" y2="60" class="cell"/><line x1="0" y1="120" x2="240" y2="120" class="cell"/><line x1="0" y1="180" x2="240" y2="180" class="cell"/>
    </g>
    <rect x="0" y="0" width="60" height="60" fill="#b8d2ff" stroke="#5a8fea"/>
    <text class="mono" x="16" y="38">a11</text>
  </g>

  <text class="label" x="520" y="170">B_tile</text>
  <g transform="translate(500 195)">
    <rect class="b" x="0" y="0" width="240" height="240" rx="10"/>
    <g>
      <line x1="60" y1="0" x2="60" y2="240" class="cell"/><line x1="120" y1="0" x2="120" y2="240" class="cell"/><line x1="180" y1="0" x2="180" y2="240" class="cell"/>
      <line x1="0" y1="60" x2="240" y2="60" class="cell"/><line x1="0" y1="120" x2="240" y2="120" class="cell"/><line x1="0" y1="180" x2="240" y2="180" class="cell"/>
    </g>
    <rect x="0" y="0" width="60" height="60" fill="#b8ecc9" stroke="#58b67c"/>
    <text class="mono" x="16" y="38">b11</text>
  </g>

  <text class="label" x="905" y="170">C_tile</text>
  <g transform="translate(880 195)">
    <rect class="c" x="0" y="0" width="240" height="240" rx="10"/>
    <g>
      <line x1="60" y1="0" x2="60" y2="240" class="cell"/><line x1="120" y1="0" x2="120" y2="240" class="cell"/><line x1="180" y1="0" x2="180" y2="240" class="cell"/>
      <line x1="0" y1="60" x2="240" y2="60" class="cell"/><line x1="0" y1="120" x2="240" y2="120" class="cell"/><line x1="0" y1="180" x2="240" y2="180" class="cell"/>
    </g>
    <rect x="0" y="0" width="240" height="60" fill="#ffd8e6" opacity=".95"/>
    <text class="mono" x="18" y="38">a11 参与 C11..C14</text>
  </g>

  <line class="arrow" x1="370" y1="315" x2="490" y2="315"/>
  <line class="arrow" x1="750" y1="315" x2="870" y2="315"/>
  <path class="reuse" d="M165 195 C210 135, 1010 135, 1000 190"/>
  <text class="small" x="440" y="140">A 的一个元素沿着 B 的列方向复用 T 次</text>
  <path class="reuse" d="M530 225 C600 500, 930 520, 930 440"/>
  <text class="small" x="565" y="560">B 的一个元素沿着 A 的行方向复用 T 次</text>

  <rect x="145" y="505" width="990" height="92" rx="18" fill="#f7f9fc" stroke="#dce3f2"/>
  <text class="mono" x="185" y="543">搬运量：A_tile + B_tile = 2T² 个元素</text>
  <text class="mono" x="185" y="575">计算量：T² 个输出 × T 次点积 ≈ 2T³ FLOPs，所以复用随 T 线性增长</text>
</svg>
