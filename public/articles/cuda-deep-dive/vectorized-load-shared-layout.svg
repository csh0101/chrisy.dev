<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Vectorized global load and shared memory layout</title>
  <desc id="desc">A thread loads a float4 from global memory and stores it into shared memory using a layout that favors later computation.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}.title{font:700 34px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.sub{font:500 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#73798a}.label{font:700 21px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.small{font:600 14px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#687084}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3f4658}.panel{fill:#fff;stroke:#dce3f2;stroke-width:2}.global{fill:#edf2ff;stroke:#86aef2}.shared{fill:#eaf8f0;stroke:#7ec79a}.reg{fill:#fff6df;stroke:#ddb85d}.cell{stroke:#dce3f2}.vec{fill:#b8d2ff;stroke:#5a8fea}.out{fill:#b8ecc9;stroke:#57b985}.arrow{fill:none;stroke:#7d879c;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7d879c"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="72">Vectorized Load + Shared Layout：搬得顺，也要摆得顺</text>
  <text class="sub" x="64" y="105">global memory 喜欢连续向量；计算阶段可能需要 shared memory 里的另一种布局。</text>

  <rect class="panel global" x="80" y="175" width="310" height="330" rx="22"/>
  <text class="label" x="120" y="218">Global Memory</text>
  <text class="small" x="120" y="246">row-major 连续地址</text>
  <g transform="translate(120 305)">
    <rect class="vec" x="0" y="0" width="200" height="54" rx="10"/>
    <line class="cell" x1="50" y1="0" x2="50" y2="54"/><line class="cell" x1="100" y1="0" x2="100" y2="54"/><line class="cell" x1="150" y1="0" x2="150" y2="54"/>
    <text class="mono" x="18" y="34">f0</text><text class="mono" x="68" y="34">f1</text><text class="mono" x="118" y="34">f2</text><text class="mono" x="168" y="34">f3</text>
    <text class="mono" x="18" y="92">float4 load</text>
  </g>

  <rect class="panel" x="500" y="175" width="250" height="330" rx="22"/>
  <text class="label" x="555" y="218">Thread</text>
  <text class="small" x="540" y="246">一次拿 16B，少发指令</text>
  <rect class="vec" x="560" y="305" width="130" height="70" rx="12"/>
  <text class="mono" x="590" y="346">float4</text>

  <rect class="panel shared" x="860" y="155" width="330" height="370" rx="22"/>
  <text class="label" x="905" y="198">Shared Memory Layout</text>
  <text class="small" x="905" y="226">写入时可以 transpose / swizzle</text>
  <g transform="translate(925 275)">
    <rect class="out" x="0" y="0" width="200" height="200" rx="10"/>
    <line class="cell" x1="50" y1="0" x2="50" y2="200"/><line class="cell" x1="100" y1="0" x2="100" y2="200"/><line class="cell" x1="150" y1="0" x2="150" y2="200"/>
    <line class="cell" x1="0" y1="50" x2="200" y2="50"/><line class="cell" x1="0" y1="100" x2="200" y2="100"/><line class="cell" x1="0" y1="150" x2="200" y2="150"/>
    <rect x="0" y="0" width="50" height="200" fill="#c7efd4" opacity=".9"/>
    <text class="mono" x="13" y="32">f0</text><text class="mono" x="13" y="82">f1</text><text class="mono" x="13" y="132">f2</text><text class="mono" x="13" y="182">f3</text>
  </g>
  <line class="arrow" x1="390" y1="340" x2="492" y2="340"/>
  <line class="arrow" x1="750" y1="340" x2="852" y2="340"/>
  <rect x="190" y="595" width="900" height="56" rx="16" fill="#f7f9fc" stroke="#dce3f2"/>
  <text class="mono" x="228" y="630">同一批数据：global 按连续读，shared 按后续计算更舒服的形状放。</text>
</svg>
