<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Shared memory bank conflict</title>
  <desc id="desc">Shared memory has banks. Accessing different banks is parallel, while many lanes hitting one bank cause conflicts.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}.title{font:700 34px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.sub{font:500 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#73798a}.label{font:700 21px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202433}.small{font:600 14px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#687084}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3f4658}.panel{fill:#fff;stroke:#dce3f2;stroke-width:2}.good{fill:#eaf8f0;stroke:#7ec79a}.bad{fill:#fff0f5;stroke:#dd8bad}.bank{fill:#f4f7fb;stroke:#cfd8ea}.hit{fill:#b8ecc9;stroke:#57b985}.conflict{fill:#ffc9d9;stroke:#d97878}.arrow{fill:none;stroke:#7d879c;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7d879c"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="72">Shared Memory Bank：近处也会堵门</text>
  <text class="sub" x="64" y="105">global memory 看 transaction；shared memory 看 warp 的访问会不会撞到同一个 bank。</text>

  <rect class="panel good" x="70" y="155" width="540" height="465" rx="22"/>
  <text class="label" x="105" y="200">无冲突：lane 分散到不同 bank</text>
  <text class="small" x="105" y="228">bank = element_index % 32</text>
  <g transform="translate(105 280)">
    <g>
      <rect class="bank hit" x="0" y="0" width="56" height="86" rx="10"/><text class="mono" x="13" y="32">B0</text><text class="mono" x="18" y="62">L0</text>
      <rect class="bank hit" x="68" y="0" width="56" height="86" rx="10"/><text class="mono" x="81" y="32">B1</text><text class="mono" x="86" y="62">L1</text>
      <rect class="bank hit" x="136" y="0" width="56" height="86" rx="10"/><text class="mono" x="149" y="32">B2</text><text class="mono" x="154" y="62">L2</text>
      <rect class="bank hit" x="204" y="0" width="56" height="86" rx="10"/><text class="mono" x="217" y="32">B3</text><text class="mono" x="222" y="62">L3</text>
      <text class="mono" x="282" y="52">...</text>
      <rect class="bank hit" x="340" y="0" width="68" height="86" rx="10"/><text class="mono" x="350" y="32">B31</text><text class="mono" x="354" y="62">L31</text>
    </g>
    <text class="mono" x="0" y="155">s[0], s[1], s[2], ... s[31]</text>
    <text class="small" x="0" y="190">连续 float 访问通常能被并行服务。</text>
  </g>

  <rect class="panel bad" x="670" y="155" width="540" height="465" rx="22"/>
  <text class="label" x="705" y="200">冲突：多个 lane 打到同一个 bank</text>
  <text class="small" x="705" y="228">典型形状：s[0], s[32], s[64]...</text>
  <g transform="translate(705 280)">
    <rect class="bank conflict" x="0" y="0" width="120" height="190" rx="14"/>
    <text class="mono" x="42" y="34">B0</text>
    <text class="mono" x="26" y="72">L0</text>
    <text class="mono" x="26" y="102">L1</text>
    <text class="mono" x="26" y="132">L2</text>
    <text class="mono" x="26" y="162">...</text>
    <rect class="bank" x="155" y="0" width="56" height="86" rx="10"/><text class="mono" x="168" y="52">B1</text>
    <rect class="bank" x="235" y="0" width="56" height="86" rx="10"/><text class="mono" x="248" y="52">B2</text>
    <text class="mono" x="318" y="52">...</text>
    <rect class="bank" x="375" y="0" width="68" height="86" rx="10"/><text class="mono" x="385" y="52">B31</text>
    <text class="mono" x="0" y="255">0 % 32 = 0, 32 % 32 = 0</text>
    <text class="small" x="0" y="290">同一个 bank 要分多轮服务，warp 被拉慢。</text>
  </g>

  <rect x="190" y="635" width="900" height="52" rx="16" fill="#f7f9fc" stroke="#dce3f2"/>
  <text class="mono" x="228" y="668">常见修法：padding 一列，把 stride 从 32 改成 33，让访问散到不同 bank。</text>
</svg>
