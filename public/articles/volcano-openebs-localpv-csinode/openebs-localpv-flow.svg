<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAF7"/>
      <stop offset="1" stop-color="#F2F6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#243B53" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#395B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102A43; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526D82; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102A43; }
      .box-text { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627D98; }
      .code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334E68; }
      .arrow { stroke: #395B64; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { stroke: #829AB1; stroke-width: 2; stroke-dasharray: 7 8; marker-end: url(#arrow); }
      .no { stroke: #C2410C; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <text class="title" x="58" y="72">OpenEBS openebs.io/local 的 LocalPV 路径</text>
  <text class="subtitle" x="58" y="102">它靠 selected-node 和 PV nodeAffinity 保证本地卷落点，不依赖每个节点注册 CSI Driver。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="190" height="90" rx="18" fill="#FFFFFF"/>
    <text class="box-title" x="96" y="213">Pod + PVC</text>
    <text class="box-text" x="96" y="240">用户提交任务</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="322" y="178" width="226" height="90" rx="18" fill="#FFFFFF"/>
    <text class="box-title" x="348" y="213">Volcano / Scheduler</text>
    <text class="box-text" x="348" y="240">先选择消费节点</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="178" width="238" height="90" rx="18" fill="#FFFFFF"/>
    <text class="box-title" x="636" y="213">PVC selected-node</text>
    <text class="code" x="636" y="240">volume.kubernetes.io/selected-node</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="910" y="178" width="220" height="90" rx="18" fill="#FFFFFF"/>
    <text class="box-title" x="936" y="213">OpenEBS Controller</text>
    <text class="box-text" x="936" y="240">创建本地 PV</text>
  </g>

  <path class="arrow" d="M260 223H322"/>
  <path class="arrow" d="M548 223H610"/>
  <path class="arrow" d="M848 223H910"/>

  <g filter="url(#shadow)">
    <rect x="250" y="372" width="260" height="104" rx="18" fill="#FFFFFF"/>
    <text class="box-title" x="276" y="407">PV</text>
    <text class="box-text" x="276" y="434">带 nodeAffinity</text>
    <text class="code" x="276" y="458">kubernetes.io/hostname = node-a</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="668" y="354" width="300" height="140" rx="22" fill="#FFFFFF"/>
    <text class="box-title" x="698" y="392">目标 Worker 节点</text>
    <text class="box-text" x="698" y="422">Pod 被约束到本地 PV 所在节点</text>
    <text class="box-text" x="698" y="450">挂载节点本地路径</text>
    <text class="code" x="698" y="474">local / hostPath semantics</text>
  </g>
  <path class="arrow" d="M1020 268C1020 338 860 342 818 354"/>
  <path class="arrow" d="M510 424H668"/>
  <path class="arrow" d="M380 372C380 328 700 310 729 268"/>

  <g>
    <rect x="74" y="342" width="124" height="110" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
    <text class="box-title" x="103" y="380">CSINode</text>
    <text class="box-text" x="99" y="409">这里不会出现</text>
    <text class="code" x="93" y="435">openebs.io/local</text>
    <path class="no" d="M88 356L184 440"/>
    <path class="no" d="M184 356L88 440"/>
  </g>

  <rect x="70" y="532" width="1060" height="52" rx="16" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text class="small" x="96" y="564">核心区别：OpenEBS LocalPV 动态创建 Kubernetes Local PV，本身不是“每个节点注册 CSI socket 后由 kubelet 记录进 CSINode”的那条路径。</text>
</svg>
