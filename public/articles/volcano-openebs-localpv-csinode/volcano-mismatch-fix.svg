<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#EEF6F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#243B53" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#3E4C59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102A43; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526D82; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102A43; }
      .box-text { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627D98; }
      .code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334E68; }
      .bad { fill: #9F1239; }
      .good { fill: #166534; }
      .arrow { stroke: #3E4C59; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { stroke: #829AB1; stroke-width: 2; stroke-dasharray: 7 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text class="title" x="58" y="72">Volcano 的误判点与修复方式</text>
  <text class="subtitle" x="58" y="102">问题不在 OpenEBS 没注册 CSINode，而在 Volcano 不该把 openebs.io/local 当成 CSI attachable resource。</text>

  <g filter="url(#shadow)">
    <rect x="64" y="156" width="230" height="106" rx="18" fill="#FFFFFF"/>
    <text class="box-title" x="92" y="193">PVC</text>
    <text class="box-text" x="92" y="220">StorageClass provisioner</text>
    <text class="code" x="92" y="244">openebs.io/local</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="372" y="156" width="260" height="106" rx="18" fill="#FFFFFF"/>
    <text class="box-title" x="400" y="193">Volcano volume logic</text>
    <text class="box-text" x="400" y="220">推导出可挂载卷资源维度</text>
    <text class="code" x="400" y="244">attachable-volumes-csi-*</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="714" y="146" width="404" height="126" rx="18" fill="#FFF1F2" stroke="#FDA4AF"/>
    <text class="box-title bad" x="742" y="184">错误过滤条件</text>
    <text class="code" x="742" y="214">attachable-volumes-csi-openebs.io/local</text>
    <text class="box-text" x="742" y="244">真实节点上没有这个资源，候选节点被过滤。</text>
  </g>
  <path class="arrow" d="M294 209H372"/>
  <path class="arrow" d="M632 209H714"/>

  <g filter="url(#shadow)">
    <rect x="142" y="356" width="356" height="124" rx="20" fill="#FFFFFF"/>
    <text class="box-title" x="172" y="394">真实 OpenEBS LocalPV 能力</text>
    <text class="box-text" x="172" y="424">根据 selected-node 创建 PV</text>
    <text class="box-text" x="172" y="450">通过 PV nodeAffinity 锁定节点</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="348" width="410" height="140" rx="20" fill="#ECFDF5" stroke="#86EFAC"/>
    <text class="box-title good" x="680" y="386">修复</text>
    <text class="code" x="680" y="418">--ignored-provisioners=openebs.io/local</text>
    <text class="box-text" x="680" y="450">让 Volcano 跳过该 provisioner 的</text>
    <text class="box-text" x="680" y="474">attachable volume capacity 判断。</text>
  </g>
  <path class="dash" d="M498 418H650"/>

  <g filter="url(#shadow)">
    <rect x="140" y="560" width="920" height="80" rx="20" fill="#FFFFFF"/>
    <text class="box-title" x="170" y="596">修复后的正确链路</text>
    <text class="code" x="170" y="624">Volcano 选节点 -> PVC selected-node -> OpenEBS 创建 Local PV -> PV nodeAffinity -> Pod 在正确节点启动</text>
  </g>
  <path class="arrow" d="M855 488C855 526 700 540 600 560"/>
  <path class="arrow" d="M320 480C320 526 470 540 600 560"/>

  <rect x="64" y="306" width="1054" height="2" fill="#D9E2EC"/>
  <text class="small" x="74" y="326">上半部分是误判路径，下半部分是修正后的路径。</text>
</svg>
