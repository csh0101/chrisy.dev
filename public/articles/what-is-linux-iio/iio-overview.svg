<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Linux IIO overview</title>
  <desc id="desc">A layered diagram showing sensors and converters, IIO kernel abstractions, sysfs and character device interfaces, and userspace applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#eef7f3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #0f172a; }
      .muted { fill: #64748b; }
      .card { rx: 24; filter: url(#shadow); }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .softEdge { stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="620" fill="url(#bg)"/>
  <text x="64" y="66" class="label">Linux IIO: 把采样设备抽象成统一的数据接口</text>
  <text x="64" y="98" class="small muted">传感器、ADC/DAC 和工业采集设备，经由 IIO core 暴露给用户态</text>

  <rect x="64" y="140" width="250" height="330" class="card" fill="#ffffff"/>
  <text x="94" y="188" class="label" font-size="24">硬件设备</text>
  <rect x="94" y="222" width="190" height="54" rx="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="118" y="256" class="small">ADC / DAC</text>
  <rect x="94" y="296" width="190" height="54" rx="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="118" y="330" class="small">IMU / 加速度计</text>
  <rect x="94" y="370" width="190" height="54" rx="16" fill="#fee2e2" stroke="#dc2626"/>
  <text x="118" y="404" class="small">温度 / 光照 / 压力</text>

  <rect x="436" y="130" width="300" height="360" class="card" fill="#ffffff"/>
  <text x="466" y="178" class="label" font-size="24">IIO Core</text>
  <text x="466" y="208" class="small muted">内核里的统一抽象层</text>
  <rect x="466" y="240" width="240" height="48" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="492" y="270" class="mono">iio_dev</text>
  <rect x="466" y="306" width="240" height="48" rx="15" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="492" y="336" class="mono">iio_chan_spec</text>
  <rect x="466" y="372" width="240" height="48" rx="15" fill="#cffafe" stroke="#0891b2"/>
  <text x="492" y="402" class="mono">buffer + trigger</text>

  <rect x="850" y="140" width="220" height="330" class="card" fill="#ffffff"/>
  <text x="880" y="188" class="label" font-size="24">用户态</text>
  <rect x="880" y="222" width="160" height="64" rx="16" fill="#f1f5f9" stroke="#475569"/>
  <text x="903" y="249" class="mono">sysfs</text>
  <text x="900" y="272" class="small muted">单次读写</text>
  <rect x="880" y="326" width="160" height="64" rx="16" fill="#f1f5f9" stroke="#475569"/>
  <text x="900" y="353" class="mono">/dev/iio</text>
  <text x="899" y="376" class="small muted">连续采样</text>

  <path d="M314 305 H426" class="edge"/>
  <path d="M736 252 H840" class="edge"/>
  <path d="M736 358 H840" class="edge"/>
  <path d="M960 326 V292" class="softEdge"/>

  <text x="342" y="286" class="small muted">I2C / SPI / platform</text>
  <text x="748" y="231" class="small muted">raw / scale</text>
  <text x="748" y="337" class="small muted">scan data</text>

  <rect x="192" y="520" width="736" height="54" rx="18" fill="#0f172a" opacity="0.92"/>
  <text x="226" y="554" class="small" fill="#ffffff">核心问题：设备怎么接不重要，重要的是上层能用统一方式读“通道上的物理量”。</text>
</svg>
