<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Training data path from object storage to tensor cores</title>
  <desc id="desc">A concise diagram showing training data moving from object storage or JuiceFS through host memory, dataloader processing, pinned memory, H2D copy, GPU HBM, L2 cache, and SM or Tensor Cores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#eef7ff"/>
      <stop offset="100%" stop-color="#f7f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 800 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .lane { font: 800 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #475569; letter-spacing: .04em; }
      .label { font: 800 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .chip { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .card { rx: 20; filter: url(#shadow); stroke-width: 1.5; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="72" class="title">训练数据路径：从存储到 Tensor Cores</text>
  <text x="64" y="104" class="subtitle">吞吐不是只发生在 GPU 上，它是一条跨存储、主机内存、CPU worker、DMA 和 GPU 层级缓存的流水线。</text>

  <text x="78" y="162" class="lane">REMOTE / CACHE</text>
  <text x="356" y="162" class="lane">HOST PIPELINE</text>
  <text x="770" y="162" class="lane">TRANSFER</text>
  <text x="990" y="162" class="lane">GPU</text>

  <rect x="52" y="178" width="260" height="428" rx="26" fill="#ffffff" stroke="#dbeafe"/>
  <rect x="338" y="178" width="388" height="428" rx="26" fill="#ffffff" stroke="#dcfce7"/>
  <rect x="752" y="178" width="162" height="428" rx="26" fill="#ffffff" stroke="#fef3c7"/>
  <rect x="940" y="178" width="228" height="428" rx="26" fill="#ffffff" stroke="#ede9fe"/>

  <rect x="86" y="230" width="220" height="78" class="card" fill="#dbeafe" stroke="#2563eb"/>
  <text x="108" y="262" class="label">Object Storage</text>
  <text x="108" y="286" class="small">S3 / OSS / JuiceFS origin</text>

  <rect x="86" y="390" width="220" height="78" class="card" fill="#cffafe" stroke="#0891b2"/>
  <text x="108" y="422" class="label">NIC / NVMe Cache</text>
  <text x="108" y="446" class="small">网络入口或本地缓存命中</text>

  <rect x="378" y="218" width="292" height="70" class="card" fill="#dcfce7" stroke="#16a34a"/>
  <text x="402" y="247" class="label">Host DDR Memory</text>
  <text x="402" y="270" class="small">page cache / 用户态 batch buffer</text>

  <rect x="378" y="324" width="292" height="70" class="card" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="402" y="353" class="label">DataLoader Workers</text>
  <text x="402" y="376" class="small">多进程预取、排队、喂 batch</text>

  <rect x="378" y="430" width="292" height="70" class="card" fill="#fee2e2" stroke="#dc2626"/>
  <text x="402" y="459" class="label">Decode / Transform / Collate</text>
  <text x="402" y="482" class="small">解码、增强、拼 batch</text>

  <rect x="378" y="536" width="292" height="70" class="card" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="402" y="565" class="label">Pinned Memory</text>
  <text x="402" y="588" class="small">锁页内存，准备 DMA 拷贝</text>

  <rect x="785" y="350" width="128" height="82" class="card" fill="#ffedd5" stroke="#f97316"/>
  <text x="814" y="385" class="label">H2D</text>
  <text x="801" y="410" class="small">PCIe / NVLink</text>

  <rect x="980" y="218" width="172" height="70" class="card" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1006" y="247" class="label">GPU VRAM / HBM</text>
  <text x="1006" y="270" class="small">batch 进入显存</text>

  <rect x="980" y="350" width="172" height="70" class="card" fill="#f5d0fe" stroke="#c026d3"/>
  <text x="1026" y="379" class="label">GPU L2</text>
  <text x="1016" y="402" class="small">片上缓存复用</text>

  <rect x="980" y="482" width="172" height="84" class="card" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="1004" y="516" class="label">SM / Tensor Cores</text>
  <text x="1008" y="540" class="small">kernel 真正消费数据</text>

  <path d="M196 308 V382" class="thin"/>
  <path d="M306 429 C338 429 344 253 370 253" class="edge"/>
  <path d="M524 288 V316" class="edge"/>
  <path d="M524 394 V422" class="edge"/>
  <path d="M524 500 V528" class="edge"/>
  <path d="M670 571 C720 571 736 391 777 391" class="edge"/>
  <path d="M913 391 C944 391 948 253 972 253" class="edge"/>
  <path d="M1066 288 V342" class="edge"/>
  <path d="M1066 420 V474" class="edge"/>

  <rect x="64" y="644" width="324" height="40" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="84" y="670" class="chip">I/O bound: 存储、网络、本地缓存</text>

  <rect x="408" y="644" width="300" height="40" rx="14" fill="#fefce8" stroke="#fde68a"/>
  <text x="428" y="670" class="chip">CPU bound: decode / transform</text>

  <rect x="728" y="644" width="250" height="40" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="748" y="670" class="chip">copy bound: pinned + H2D</text>

  <rect x="998" y="644" width="214" height="40" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="1018" y="670" class="chip">compute bound: SM 利用率</text>
</svg>
