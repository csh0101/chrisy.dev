<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b6ff5"/>
    </marker>
    <style>
      .box { fill: #f0eaff; stroke: #8b6ff5; stroke-width: 1.5; rx: 6; }
      .sdk { fill: #fff4a3; stroke: #d6b656; stroke-width: 1.5; rx: 6; }
      .k8s { fill: #eaf7fb; stroke: #7fb7c7; stroke-width: 1.5; rx: 6; }
      .gateway { fill: #eaf8eb; stroke: #76b47c; stroke-width: 1.5; rx: 6; }
      .error { fill: #fff0f0; stroke: #d66; stroke-width: 1.5; rx: 6; }
      .boundary { fill: #ffffff; stroke: #8b6ff5; stroke-width: 1.4; stroke-dasharray: 6 5; rx: 6; }
      .label { font-family: "PingFang SC", Arial, sans-serif; font-size: 14px; fill: #333; }
      .small { font-family: "PingFang SC", Arial, sans-serif; font-size: 12px; fill: #555; }
      .title { font-family: "PingFang SC", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #222; }
      .arrow { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #8b6ff5; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <text x="40" y="36" class="title">Exposure Declaration SDK Flow</text>
  <text x="40" y="58" class="small">SDK 只生成声明，不访问 Kubernetes 或 APISIX；Translator 仍然消费真实 Pod metadata。</text>

  <rect x="40" y="95" width="155" height="78" class="box"/>
  <text x="117.5" y="122" text-anchor="middle" class="label">业务项目</text>
  <text x="117.5" y="146" text-anchor="middle" class="small">Deployment / STS</text>
  <text x="117.5" y="164" text-anchor="middle" class="small">Helm / Operator</text>

  <rect x="240" y="95" width="150" height="78" class="sdk"/>
  <text x="315" y="124" text-anchor="middle" class="label">pkg/exposuredecl</text>
  <text x="315" y="150" text-anchor="middle" class="small">Build(Spec)</text>

  <path d="M455 95 L545 134 L455 173 L365 134 Z" fill="#fff" stroke="#8b6ff5" stroke-width="1.5"/>
  <text x="455" y="130" text-anchor="middle" class="label">Validate</text>
  <text x="455" y="150" text-anchor="middle" class="small">routes</text>

  <rect x="585" y="95" width="170" height="78" class="sdk"/>
  <text x="670" y="122" text-anchor="middle" class="label">labels + annotations</text>
  <text x="670" y="146" text-anchor="middle" class="small">enabled=true</text>
  <text x="670" y="164" text-anchor="middle" class="small">routes JSON</text>

  <rect x="800" y="95" width="155" height="78" class="k8s"/>
  <text x="877.5" y="124" text-anchor="middle" class="label">PodTemplate</text>
  <text x="877.5" y="150" text-anchor="middle" class="small">Pod metadata</text>

  <rect x="1000" y="95" width="140" height="78" class="k8s"/>
  <text x="1070" y="124" text-anchor="middle" class="label">Kubernetes</text>
  <text x="1070" y="150" text-anchor="middle" class="small">creates Pods</text>

  <rect x="800" y="260" width="155" height="78" class="gateway"/>
  <text x="877.5" y="288" text-anchor="middle" class="label">Translator</text>
  <text x="877.5" y="314" text-anchor="middle" class="small">watch enabled Pods</text>

  <rect x="585" y="260" width="170" height="78" class="gateway"/>
  <text x="670" y="288" text-anchor="middle" class="label">APISIX Admin API</text>
  <text x="670" y="314" text-anchor="middle" class="small">route / upstream</text>

  <rect x="380" y="260" width="150" height="78" class="gateway"/>
  <text x="455" y="288" text-anchor="middle" class="label">APISIX DP</text>
  <text x="455" y="314" text-anchor="middle" class="small">forward PodIP:Port</text>

  <rect x="245" y="245" width="120" height="108" class="error"/>
  <text x="305" y="277" text-anchor="middle" class="label">invalid</text>
  <text x="305" y="302" text-anchor="middle" class="small">ValidationErrors</text>
  <text x="305" y="322" text-anchor="middle" class="small">不生成 metadata</text>

  <rect x="40" y="245" width="170" height="108" class="boundary"/>
  <text x="125" y="275" text-anchor="middle" class="label">声明边界</text>
  <text x="125" y="300" text-anchor="middle" class="small">no kubeconfig</text>
  <text x="125" y="320" text-anchor="middle" class="small">no client-go</text>
  <text x="125" y="340" text-anchor="middle" class="small">no APISIX call</text>

  <path d="M195 134 L232 134" class="arrow"/>
  <path d="M390 134 L365 134" class="arrow"/>
  <path d="M545 134 L577 134" class="arrow"/>
  <path d="M755 134 L792 134" class="arrow"/>
  <path d="M955 134 L992 134" class="arrow"/>
  <path d="M1070 173 L1070 219 L878 219 L878 252" class="arrow"/>
  <path d="M800 299 L763 299" class="arrow"/>
  <path d="M585 299 L538 299" class="arrow"/>
  <path d="M455 173 L455 220 L365 220 L325 245" class="arrow"/>
  <path d="M315 173 L190 245" class="dashed"/>

  <text x="564" y="124" class="small">valid</text>
  <text x="405" y="210" class="small">invalid</text>
</svg>
